name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-musl
          - aarch64-linux-musl
          - aarch64-macos
          - x86_64-windows-gnu
          - aarch64-windows-gnu
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cross-compile with Zig
        run: >-
          nix develop -c zig build
          -Dtarget=${{ matrix.target }} --release=fast
          --prefix target/${{ matrix.target }}

      - name: Check formatting and native Nix package
        if: matrix.target == 'x86_64-linux-musl'
        run: |
          nix develop -c zig fmt --check build.zig tools
          nix build

      - name: Generate and check editor configuration
        run: |
          nix develop -c zig build compdb --release=fast -Dtarget=${{ matrix.target }}
          nix develop -c clangd --check=foobar/main.c --log=error

      - name: Prepare release executable
        if: github.ref_type == 'tag'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          ext=''
          if [[ "$TARGET" == *-windows-* ]]; then ext='.exe'; fi
          cp "target/$TARGET/bin/foobar$ext" "foobar-$TARGET$ext"

      - name: Upload release executable
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: foobar-${{ matrix.target }}*
          if-no-files-found: error

  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download release executables
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
