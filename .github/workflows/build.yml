name: Build

on:
  push:
    paths-ignore:
      - '**.md'
      - LICENSE
  pull_request:
    paths-ignore:
      - '**.md'
      - LICENSE
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ubuntu:
    name: Linux and Windows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STATIC: 1
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build debug
        run: nix develop .#default --no-update-lock-file -c make -j2 RELEASE=0

      - name: Build release
        run: |
          # eval-cache is disabled because parallel evaluations contend on it.
          printf '%s\n' default linux-arm64 windows windows-arm64 |
            xargs -P4 -I{} nix develop ".#{}" --no-update-lock-file \
              --option eval-cache false -c make -j2 RELEASE=1

      - name: Prepare release executables
        if: github.ref_type == 'tag'
        run: |
          cp target/x86_64-unknown-linux-musl/release/foobar foobar-x86_64-unknown-linux-musl
          cp target/aarch64-unknown-linux-musl/release/foobar foobar-aarch64-unknown-linux-musl
          cp target/x86_64-w64-mingw32/release/foobar.exe foobar-x86_64-w64-mingw32.exe
          cp target/aarch64-w64-mingw32/release/foobar.exe foobar-aarch64-w64-mingw32.exe

      - name: Upload release executables
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-windows
          path: foobar-*
          if-no-files-found: error

  macos:
    name: macOS ARM64
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build debug
        run: nix develop .#default --no-update-lock-file -c make -j2 RELEASE=0

      - name: Build release
        run: nix develop .#default --no-update-lock-file -c make -j2 RELEASE=1

      - name: Prepare release executable
        if: github.ref_type == 'tag'
        run: cp target/arm64-apple-darwin/release/foobar foobar-arm64-apple-darwin

      - name: Upload release executable
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: foobar-arm64-apple-darwin
          if-no-files-found: error

  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: [ubuntu, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release executables
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
