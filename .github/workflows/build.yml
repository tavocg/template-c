name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Linux
            runner: ubuntu-latest
            devshell: default
          - target: macOS
            runner: macos-latest
            devshell: default
          - target: Windows
            runner: ubuntu-latest
            devshell: windows
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build
        run: nix develop ".#${{ matrix.devshell }}" -c make -j2

