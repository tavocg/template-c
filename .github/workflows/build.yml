name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build all targets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check formatting and native Nix package
        run: |
          nix develop -c zig fmt --check build.zig tools
          nix build

      - name: Build and check all targets
        run: |
          nix develop -c bash -euo pipefail -c '
            mkdir -p dist
            for target in \
              x86_64-linux-musl aarch64-linux-musl aarch64-macos \
              x86_64-windows-gnu aarch64-windows-gnu
            do
              echo "::group::$target"
              zig build --release=fast -Dtarget="$target" --prefix "target/$target"
              zig build compdb --release=fast -Dtarget="$target"
              clangd --check=foobar/main.c --log=error
              ext=""
              if [[ "$target" == *-windows-* ]]; then ext=".exe"; fi
              cp "target/$target/bin/foobar$ext" "dist/foobar-$target$ext"
              echo "::endgroup::"
            done
          '

      - name: Upload release executables
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: release-binaries
          path: dist/foobar-*
          if-no-files-found: error

  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download release executables
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
